name: AI Support Agent Evaluation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Golden Dataset
      env:
        PYTHONPATH: .
      run: |
        python generate_golden_set.py

    - name: Run PyTest Verification Suite
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v

    - name: Execute Main Pipeline Harness
      env:
        PYTHONPATH: .
        OPENAI_API_KEY: "dummy-key-offline-mode"
      run: |
        python run_pipeline.py --sample-size 200
