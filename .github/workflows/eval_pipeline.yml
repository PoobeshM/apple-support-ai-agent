name: AI Support Agent Evaluation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest Verification Suite
        run: |
          pytest tests/ -v

      - name: Generate Golden Dataset
        run: |
          python generate_golden_set.py

      - name: Execute End-to-End Evaluation Pipeline
        run: |
          python run_pipeline.py --sample-size 200
